<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>EZTor Translation Quality Demo</title>
<style>body{font:16px system-ui;max-width:760px;margin:40px auto;padding:0 20px;color:#17202a}input{display:block;width:100%;box-sizing:border-box;padding:10px;margin:8px 0;border:1px solid #cbd5e1;border-radius:8px}button{font:inherit;padding:10px 16px;border:0;border-radius:8px;background:#2563eb;color:#fff;cursor:pointer}pre{background:#f3f4f6;padding:16px;border-radius:10px;white-space:pre-wrap}</style>
<h1>EZTor Translation Quality</h1><p>See how transparent factors affect a vocabulary translation score.</p><input id="word" value="resilient" placeholder="English word"><input id="phonetic" value="/rɪˈzɪliənt/" placeholder="Phonetic"><input id="pos" value="adj." placeholder="Part of speech"><input id="translation" value="有韧性的；能复原的" placeholder="Translation"><input id="example" value="She remained resilient after the setback." placeholder="Example"><input id="exampleTranslation" value="遭遇挫折后她依然坚韧。" placeholder="Example translation"><button onclick="score()">Score translation</button><pre id="out"></pre><p><a href="https://github.com/Bailipa/eztor-translation-quality">View source on GitHub</a></p>
<script>function score(){let v=id=>document.getElementById(id).value.trim(),word=v('word'),pos=v('pos'),translation=v('translation'),example=v('example'),et=v('exampleTranslation'),f={hasPhonetic:!!v('phonetic'),hasPos:!!pos,hasExample:!!example,hasExampleTranslation:!!et,translationLength:translation.length,exampleLength:example.length,hasMultiplePos:/[\/;]/.test(pos),isError:pos==='错误'||translation.includes('拼写错误'),isSensitive:translation.includes('粗俗')||translation.includes('敏感'),isNonEnglish:/[^\x00-\x7F]/.test(word),isSentence:false};let s=0;if(f.isError||f.isSensitive||f.isNonEnglish) s=0;else{s+=f.hasPhonetic?15:0;s+=f.hasPos?15:0;s+=f.hasExample?20:0;s+=f.hasExampleTranslation?10:0;s+=f.translationLength>10?10:0;s+=f.translationLength>30?5:0;s+=f.hasMultiplePos?10:0;s+=f.exampleLength>20?10:0;s+=f.exampleLength>50?5:0}document.getElementById('out').textContent=JSON.stringify({score:Math.min(s,100),grade:s>=80?'A':s>=60?'B':s>=40?'C':'D',factors:f},null,2)}score()</script>
